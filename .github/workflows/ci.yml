name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: meteo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d meteo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/meteo_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/meteo_ci
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ALLOW_DEMO_SEED: 'true'
      DEMO_SEED_PASSWORD: Ci-Demo-Password!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run db:schema:check
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run content:check
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:demo
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
